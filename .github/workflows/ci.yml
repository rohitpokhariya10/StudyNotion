name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client:
    name: Contracts and web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run contracts:openapi:check
      - run: npm run contracts:test
      - run: npm run contracts:generate
      - run: git diff --exit-code -- packages/contracts/openapi.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.test/api/v1
          VITE_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
          VITE_RAZORPAY_KEY_ID: rzp_live_CIBUILD123
          VITE_SUPPORT_EMAIL: support@studynotion.test
          VITE_LEGAL_ENTITY_NAME: StudyNotion CI
          VITE_LEGAL_ADDRESS: CI test environment
          VITE_LEGAL_JURISDICTION: India

  server:
    name: API unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace studynotion-backend test

  catalog-integration:
    name: Catalog MongoDB and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration
        env:
          CATALOG_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/studynotion_catalog_test_ci
          CATALOG_TEST_REDIS_URL: redis://127.0.0.1:6379/14

  catalog-e2e:
    name: Catalog Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4000/api/v1

  containers:
    name: Container builds and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate local Compose configuration
        run: >-
          docker compose
          --env-file compose.local.env.example
          -f compose.local.yml
          config --quiet
      - run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://api.example.test/api/v1
          --build-arg VITE_GOOGLE_CLIENT_ID=ci-test.apps.googleusercontent.com
          --build-arg VITE_RAZORPAY_KEY_ID=rzp_live_CIBUILD123
          --build-arg VITE_SUPPORT_EMAIL=support@studynotion.test
          --build-arg VITE_LEGAL_ENTITY_NAME="StudyNotion CI"
          --build-arg VITE_LEGAL_ADDRESS="CI test environment"
          --build-arg VITE_LEGAL_JURISDICTION=India
          -t studynotion-web:ci .
      - run: docker build -f server/Dockerfile -t studynotion-api:ci .
      - name: Verify container users and web runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect studynotion-web:ci --format '{{.Config.User}}')" = "nginx"
          test "$(docker image inspect studynotion-api:ci --format '{{.Config.User}}')" = "node"

          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 studynotion-web:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          test "$(docker exec "$container_id" id -u)" -ne 0
          curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null
          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:18080/)"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: DENY' <<<"$headers"
          grep -qi '^Content-Security-Policy:' <<<"$headers"
      - name: Verify API container readiness
        shell: bash
        run: |
          set -euo pipefail
          docker tag studynotion-api:ci studynotion-api:local
          trap 'docker compose --env-file compose.local.env.example -f compose.local.yml down --volumes >/dev/null' EXIT

          docker compose \
            --env-file compose.local.env.example \
            -f compose.local.yml \
            up --detach --no-build --wait mongo redis api

          test "$(docker compose --env-file compose.local.env.example -f compose.local.yml exec -T api id -u)" -ne 0
          curl --fail --silent --show-error http://127.0.0.1:4000/health/ready >/dev/null
