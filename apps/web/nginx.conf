server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # Browser/API traffic now passes through this Nginx container.
  # Backend application limit remains UPLOAD_MAX_BYTES=26214400 (~25 MiB).
  # A small transport buffer is kept for multipart/form-data overhead.
  client_max_body_size 30m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com; media-src 'self' blob: https://api.cloudinary.com https://res.cloudinary.com; connect-src 'self' __API_ORIGIN__ https://accounts.google.com https://*.googleapis.com https://api.cloudinary.com https://api.razorpay.com https://*.razorpay.com https://res.cloudinary.com; frame-src https://accounts.google.com https://api.razorpay.com https://*.razorpay.com; worker-src 'self' blob:; manifest-src 'self'" always;

  # Health check for the public web/Nginx container.
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Static Vite assets.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # ECS/Fargate layout:
  #
  # Main container = Nginx / React web
  # API container  = Node / Express on port 4000
  #
  # Both containers run inside the same Fargate task, so Nginx can reach
  # Express over the task loopback interface.
  #
  # No trailing slash on proxy_pass:
  # /api/v1/... remains /api/v1/... when forwarded to Express.

  location = /api {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;

    # Preserve forwarding information supplied by the AWS load balancer.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;

    # Preserve forwarding information supplied by the AWS load balancer.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # Reset credentials live only in the browser URL fragment.
  # Keep this route out of access logs as defense in depth.
  location = /update-password {
    access_log off;
    try_files $uri /index.html;
    expires -1;
  }

  # React SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;

  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;
}